<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarjeta Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>📇 Crea tu Tarjeta Digital</h1>
        
        <form id="form-tarjeta">
            <div class="grupo">
                <label>Nombre completo</label>
                <input type="text" id="nombre" required>
            </div>
            
            <div class="grupo">
                <label>Cargo / Profesión</label>
                <input type="text" id="cargo" required>
            </div>
            
            <div class="grupo">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="grupo">
                <label>Teléfono</label>
                <input type="tel" id="telefono" required>
            </div>
            
            <div class="grupo">
                <label>Empresa (opcional)</label>
                <input type="text" id="empresa">
            </div>
            
            <div class="grupo">
                <label>LinkedIn (opcional)</label>
                <input type="url" id="linkedin" placeholder="https://linkedin.com/in/...">
            </div>
            
            <div class="grupo">
                <label>Elige una plantilla</label>
                <select id="plantilla">
                    <option value="1">Moderna (azul)</option>
                    <option value="2">Minimalista (blanco/negro)</option>
                    <option value="3">Creativa (gradiente)</option>
                </select>
            </div>
            
            <button type="submit">Ver vista previa</button>
        </form>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
