<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarjeta Digital - Julio Vargas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>📇 Crea tu Tarjeta Digital</h1>
        
        <form id="form-tarjeta">
            <div class="grupo">
                <label>Nombre completo</label>
                <input type="text" id="nombre" value="Julio Vargas" required>
            </div>
            
            <div class="grupo">
                <label>Cargo / Profesión</label>
                <input type="text" id="cargo" value="Gerente" required>
            </div>
            
            <div class="grupo">
                <label>Email</label>
                <input type="email" id="email" value="NGEGESTION@gmail.com" required>
            </div>
            
            <div class="grupo">
                <label>Teléfono</label>
                <input type="tel" id="telefono" value="0416-6520591" required>
            </div>
            
            <div class="grupo">
                <label>Empresa (opcional)</label>
                <input type="text" id="empresa" value="nge">
            </div>
            
            <div class="grupo">
                <label>LinkedIn o Web (opcional)</label>
                <!-- Corregido el placeholder para que sea más claro -->
                <input type="url" id="linkedin" value="https://guia-digital.com" placeholder="https://...">
            </div>
            
            <div class="grupo">
                <label>Elige una plantilla</label>
                <select id="plantilla">
                    <option value="1">Moderna (azul)</option>
                    <option value="2">Minimalista (blanco/negro)</option>
                    <option value="3">Creativa (gradiente)</option>
                </select>
            </div>
            
            <button type="submit">✨ Ver vista previa</button>
        </form>

        <!-- AQUÍ SE MOSTRARÁ LA TARJETA -->
        <div id="contenedor-preview" class="oculto">
            <h2 style="text-align:center; margin-top:30px;">Vista Previa de tu Tarjeta</h2>
            <div id="tarjeta-render"></div>
            <button onclick="window.print()" style="background:#28a745; margin-top:15px;">🖨️ Imprimir / Guardar como PDF</button>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
