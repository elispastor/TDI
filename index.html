<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Tarjetas Digitales</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>📇 Crea tu Tarjeta Digital</h1>
        
        <form id="form-tarjeta">
            <div class="grupo">
                <label>Nombre completo</label>
                <input type="text" id="nombre" value="Julio Vargas" required>
            </div>
            
            <div class="grupo">
                <label>Cargo / Profesión</label>
                <input type="text" id="cargo" value="Gerente" required>
            </div>
            
            <div class="grupo">
                <label>Email</label>
                <input type="email" id="email" value="NGEGESTION@gmail.com" required>
            </div>
            
            <div class="grupo">
                <label>Teléfono</label>
                <input type="tel" id="telefono" value="0416-6520591" required>
            </div>
            
            <div class="grupo">
                <label>Empresa (opcional)</label>
                <input type="text" id="empresa" value="nge">
            </div>
            
            <div class="grupo">
                <label>Sitio Web o LinkedIn</label>
                <input type="url" id="linkedin" value="https://guia-digital.com" placeholder="https://...">
            </div>
            
            <div class="grupo">
                <label>Elige una plantilla</label>
                <select id="plantilla">
                    <option value="moderna">Moderna (Azul)</option>
                    <option value="minimalista">Minimalista (Blanco/Negro)</option>
                    <option value="creativa">Creativa (Gradiente)</option>
                </select>
            </div>
            
            <!-- type="button" evita que la página se recargue -->
            <button type="button" id="btn-ver">✨ Generar Vista Previa</button>
        </form>

        <!-- Contenedor de la Vista Previa -->
        <div id="contenedor-preview" class="oculto">
            <h2 style="text-align:center; margin-top:30px; color:#333;">Tu Tarjeta Digital</h2>
            
            <!-- Aquí se dibuja la tarjeta -->
            <div id="tarjeta-render"></div>
            
            <div style="text-align:center; margin-top:20px; display:flex; gap:10px; justify-content:center;">
                <button onclick="window.print()" class="btn-secundario">🖨️ Imprimir / PDF</button>
                <button id="btn-descargar" class="btn-secundario">💾 Guardar en Contactos</button>
            </div>
            
            <button onclick="location.reload()" style="background:#6c757d; margin-top:15px;">🔄 Crear otra</button>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
